<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rağbet Mutfak (iPhone Uyumlu)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .ekran { display: none; padding: 20px; }
        .aktif-ekran { display: block; }
        
        /* Mutfak Butonu Tasarımı */
        .dev-buton {
            width: 280px; height: 280px;
            font-size: 2.5rem; font-weight: bold;
            border-radius: 50%;
            border: 10px solid #c3e6cb;
            background-color: #28a745; color: white;
            box-shadow: 0 10px 25px rgba(40, 167, 69, 0.5);
            transition: all 0.2s;
            cursor: pointer;
            margin-top: 30px;
            touch-action: manipulation; /* Mobilde gecikmeyi önler */
        }
        .dev-buton:active { transform: scale(0.95); background-color: #218838; }

        /* Garson Ekranı Listesi */
        .bildirim-satiri {
            background: white; padding: 20px;
            margin-bottom: 15px; border-radius: 12px;
            border-left: 10px solid #dc3545;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex; justify-content: space-between; align-items: center;
            font-size: 1.5rem;
            font-weight: bold;
            animation: slideIn 0.5s ease-out;
        }
        .yeni-gelen { 
            background-color: #ffe6e6; 
            animation: flash 1s infinite alternate; 
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes flash {
            from { border-left-color: #dc3545; }
            to { border-left-color: #ffc107; }
        }
        
        .saat-bilgisi { font-size: 1.1rem; color: #6c757d; }

        /* iPhone Uyarısı */
        .iphone-not {
            font-size: 0.9rem; color: #666; margin-top: 10px; font-style: italic;
        }
    </style>
</head>
<body>

    <div id="giris-ekrani" class="container text-center mt-5 ekran aktif-ekran">
        <h2 class="mb-4">Rağbet Cafe Sistemi</h2>
        <div class="row justify-content-center">
            <div class="col-12 col-md-5 mb-3">
                <button onclick="ekranDegistir('mutfak')" class="btn btn-success btn-lg w-100 py-4 fs-3">🍳 MUTFAK</button>
            </div>
            <div class="col-12 col-md-5">
                <button onclick="ekranDegistir('garson')" class="btn btn-danger btn-lg w-100 py-4 fs-3">💻 GARSON</button>
            </div>
        </div>
    </div>

    <div id="mutfak-ekrani" class="container ekran text-center">
        <h3 class="mb-3">Yemek Hazır Butonu</h3>
        <div class="d-flex justify-content-center">
            <button class="dev-buton" onclick="cagriGonder()">
                YEMEK<br>HAZIR
            </button>
        </div>
        <button onclick="location.reload()" class="btn btn-outline-secondary mt-5 w-50">Çıkış</button>
    </div>

    <div id="garson-ekrani" class="container ekran">
        <div class="alert alert-danger text-center cursor-pointer p-3" id="ses-izni-btn" onclick="sesiAktifEt()">
            <div class="fs-4 fw-bold">🔊 SESİ AÇMAK İÇİN TIKLA</div>
            <div class="iphone-not">(iPhone yanındaki sessize alma tuşu kapalı olmalıdır!)</div>
        </div>

        <h3 class="mb-3 border-bottom pb-2">Son Çağrılar</h3>
        <div id="bildirim-listesi">
            <div class="text-center text-muted mt-5 fs-5" id="bos-mesaj">Henüz çağrı yok...</div>
        </div>
        <button onclick="location.reload()" class="btn btn-secondary mt-5 w-100">Çıkış</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded, query, limitToLast } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // CONFIG AYARLARI
        const firebaseConfig = {
          apiKey: "AIzaSyAFSTlydF-rsz0ukofoBSsXL0OTK2r3SG4",
          authDomain: "ragbet-mutfak.firebaseapp.com",
          projectId: "ragbet-mutfak",
          storageBucket: "ragbet-mutfak.firebasestorage.app",
          messagingSenderId: "535116135064",
          appId: "1:535116135064:web:813856fd83e7eb447aaeed",
          measurementId: "G-6SL6EE933E"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const cagriRef = ref(db, 'cagrilar');

        // Mutfak Gönderim
        window.cagriGonder = function() {
            const simdi = new Date();
            const saatDakika = simdi.getHours().toString().padStart(2, '0') + ":" + simdi.getMinutes().toString().padStart(2, '0');
            
            push(cagriRef, {
                mesaj: "Yemek Hazır",
                saat: saatDakika,
                timestamp: Date.now()
            });

            // Buton animasyonu
            const btn = document.querySelector('.dev-buton');
            btn.style.transform = "scale(0.9)";
            setTimeout(() => btn.style.transform = "scale(1)", 100);
        }

        // Garson Dinleme
        window.garsonDinle = function() {
            const sonCagrilar = query(cagriRef, limitToLast(10));

            onChildAdded(sonCagrilar, (snapshot) => {
                const data = snapshot.val();
                
                const bosMesaj = document.getElementById('bos-mesaj');
                if(bosMesaj) bosMesaj.style.display = 'none';

                const liste = document.getElementById('bildirim-listesi');
                
                const satir = document.createElement('div');
                satir.className = 'bildirim-satiri yeni-gelen';
                satir.innerHTML = `
                    <span>🔔 YEMEK HAZIR!</span>
                    <span class="saat-bilgisi">${data.saat}</span>
                `;
                
                liste.insertBefore(satir, liste.firstChild);

                // Son 10 saniye kontrolü
                if (Date.now() - data.timestamp < 10000) {
                    gucluSesCal();
                }

                setTimeout(() => {
                    satir.classList.remove('yeni-gelen');
                }, 5000);
            });
        }
    </script>

    <script>
        // İŞTE ÇÖZÜM: IPHONE UYUMLU MP3 DOSYASI (Alarm Sesi)
        // Bu linkteki dosya MP3 formatındadır.
        let audio = new Audio('https://www.soundjay.com/mechanical/sounds/smoke-detector-1.mp3');
        
        function ekranDegistir(tip) {
            document.getElementById('giris-ekrani').classList.remove('aktif-ekran');
            if(tip === 'mutfak') {
                document.getElementById('mutfak-ekrani').classList.add('aktif-ekran');
            } else {
                document.getElementById('garson-ekrani').classList.add('aktif-ekran');
                if(window.garsonDinle) window.garsonDinle();
            }
        }

        function sesiAktifEt() {
            // iPhone'da sesi tetiklemek için önce boş çalıyoruz
            audio.volume = 1.0;
            audio.play().then(() => { 
                audio.pause(); 
                audio.currentTime = 0; 
                document.getElementById('ses-izni-btn').style.display = 'none';
            }).catch(e => {
                alert("Hata: Ses çalınamadı. Lütfen iPhone'un solundaki Sessize Alma tuşunu kontrol edin veya sayfayı yenileyip tekrar deneyin.");
                console.log(e);
            });
        }

        function gucluSesCal() {
            audio.currentTime = 0;
            audio.play().catch(e => console.log("Otomatik çalma hatası:", e));
            
            // Tekrarla (Daha çok duyulsun)
            setTimeout(() => { audio.currentTime = 0; audio.play(); }, 1000);
            setTimeout(() => { audio.currentTime = 0; audio.play(); }, 2000);
        }
    </script>
</body>
</html>
