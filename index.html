<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rağbet Mutfak Sistemi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .ekran { display: none; padding: 20px; }
        .aktif-ekran { display: block; }
        
        /* Mutfak Butonu Tasarımı */
        .dev-buton {
            width: 300px; height: 300px;
            font-size: 3rem; font-weight: bold;
            border-radius: 50%; /* Yuvarlak buton */
            border: 10px solid #c3e6cb;
            background-color: #28a745; color: white;
            box-shadow: 0 10px 25px rgba(40, 167, 69, 0.5);
            transition: all 0.2s;
            cursor: pointer;
            margin-top: 50px;
        }
        .dev-buton:active { transform: scale(0.95); background-color: #218838; }

        /* Garson Ekranı Listesi */
        .bildirim-satiri {
            background: white; padding: 20px;
            margin-bottom: 15px; border-radius: 10px;
            border-left: 7px solid #007bff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: flex; justify-content: space-between; align-items: center;
            font-size: 1.5rem;
            animation: slideIn 0.5s ease-out;
        }
        .yeni-gelen { background-color: #e7f1ff; border-left-color: #28a745; font-weight: bold; }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .saat-bilgisi { font-size: 1.1rem; color: #6c757d; }
    </style>
</head>
<body>

    <div id="giris-ekrani" class="container text-center mt-5 ekran aktif-ekran">
        <h2 class="mb-5">Rağbet Cafe Çağrı Sistemi</h2>
        <div class="row justify-content-center">
            <div class="col-md-5 mb-3">
                <button onclick="ekranDegistir('mutfak')" class="btn btn-success btn-lg w-100 py-5 fs-2">🍳 MUTFAK GİRİŞİ</button>
            </div>
            <div class="col-md-5">
                <button onclick="ekranDegistir('garson')" class="btn btn-primary btn-lg w-100 py-5 fs-2">💻 GARSON EKRANI</button>
            </div>
        </div>
    </div>

    <div id="mutfak-ekrani" class="container ekran text-center">
        <h3 class="mb-3">Yemek Hazır Olduğunda Basın</h3>
        <div class="d-flex justify-content-center">
            <button class="dev-buton" onclick="cagriGonder()">
                YEMEK<br>HAZIR
            </button>
        </div>
        <button onclick="location.reload()" class="btn btn-outline-secondary mt-5">Çıkış</button>
    </div>

    <div id="garson-ekrani" class="container ekran">
        <div class="alert alert-info text-center cursor-pointer" id="ses-izni-btn" onclick="sesiAktifEt()">
            🔊 Sesi açmak için lütfen buraya tıklayın (Mecburi)
        </div>

        <h3 class="mb-4 border-bottom pb-2">Son Çağrılar</h3>
        <div id="bildirim-listesi">
            <div class="text-center text-muted mt-5" id="bos-mesaj">Henüz çağrı yok...</div>
        </div>
        <button onclick="location.reload()" class="btn btn-secondary mt-5">Çıkış</button>
    </div>

    <script type="module">
        // Firebase kütüphanelerini import ediyoruz
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded, query, limitToLast } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // SENİN VERDİĞİN CONFIG BİLGİLERİ (Doğrudan Yerleştirildi)
        const firebaseConfig = {
          apiKey: "AIzaSyAFSTlydF-rsz0ukofoBSsXL0OTK2r3SG4",
          authDomain: "ragbet-mutfak.firebaseapp.com",
          projectId: "ragbet-mutfak",
          storageBucket: "ragbet-mutfak.firebasestorage.app",
          messagingSenderId: "535116135064",
          appId: "1:535116135064:web:813856fd83e7eb447aaeed",
          measurementId: "G-6SL6EE933E"
        };

        // Firebase Başlatma
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const cagriRef = ref(db, 'cagrilar');

        // --- MUTFAK: Butona basınca çalışır ---
        window.cagriGonder = function() {
            const simdi = new Date();
            const saatDakika = simdi.getHours().toString().padStart(2, '0') + ":" + simdi.getMinutes().toString().padStart(2, '0');
            
            // Veritabanına gönder
            push(cagriRef, {
                mesaj: "Yemek Hazır",
                saat: saatDakika,
                timestamp: Date.now()
            });

            // Mutfaktaki kişi bastığını anlasın diye butonu hafif titretelim/küçültelim
            const btn = document.querySelector('.dev-buton');
            btn.style.transform = "scale(0.9)";
            setTimeout(() => btn.style.transform = "scale(1)", 100);
        }

        // --- GARSON: Dinleme Modu ---
        window.garsonDinle = function() {
            // Son 10 çağrıyı getir
            const sonCagrilar = query(cagriRef, limitToLast(10));

            onChildAdded(sonCagrilar, (snapshot) => {
                const data = snapshot.val();
                
                // "Henüz çağrı yok" yazısını kaldır
                const bosMesaj = document.getElementById('bos-mesaj');
                if(bosMesaj) bosMesaj.style.display = 'none';

                const liste = document.getElementById('bildirim-listesi');
                
                // Yeni satır oluştur
                const satir = document.createElement('div');
                satir.className = 'bildirim-satiri yeni-gelen';
                satir.innerHTML = `
                    <span>🍽️ YEMEK HAZIR</span>
                    <span class="saat-bilgisi">${data.saat}</span>
                `;
                
                // En üste ekle (prepend)
                liste.insertBefore(satir, liste.firstChild);

                // Sadece son 10 saniye içinde gelen veriler için ses çal
                // (Eski veriler için sayfa yenilenince ses çalmasın diye)
                if (Date.now() - data.timestamp < 10000) {
                    tekBipSesi();
                }

                // 5 saniye sonra yeşil vurguyu kaldır
                setTimeout(() => {
                    satir.classList.remove('yeni-gelen');
                }, 5000);
            });
        }
    </script>

    <script>
        // Ses Dosyası
        let audio = new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg');
        
        function ekranDegistir(tip) {
            document.getElementById('giris-ekrani').classList.remove('aktif-ekran');
            if(tip === 'mutfak') {
                document.getElementById('mutfak-ekrani').classList.add('aktif-ekran');
            } else {
                document.getElementById('garson-ekrani').classList.add('aktif-ekran');
                if(window.garsonDinle) window.garsonDinle();
            }
        }

        // Tarayıcıların otomatik sesi engellemesini aşmak için manuel onay
        function sesiAktifEt() {
            audio.play().then(() => { 
                audio.pause(); 
                audio.currentTime = 0; 
                document.getElementById('ses-izni-btn').style.display = 'none';
            }).catch(e => alert("Ses izni verilemedi, tarayıcı ayarlarını kontrol edin."));
        }

        function tekBipSesi() {
            audio.currentTime = 0;
            audio.play().catch(e => console.log("Ses çalma hatası:", e));
        }
    </script>
</body>
</html>
